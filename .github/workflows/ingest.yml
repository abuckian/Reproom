name: Collect reviews
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ingest
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ingest.py
      - name: Commit and redeploy if new reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet reviews.json; then
            git config user.name "reproom-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Add new reviews"
            git push
            gh workflow run pages.yml
          fi
