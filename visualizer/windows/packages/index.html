<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2459e0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <title>RepRoom · Windows</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=winpkg1">
</head>
<body class="noprice">
  <header class="topbar">
    <a class="brand" id="brand" href="../?v=winpkg1" aria-label="RepRoom">
      <img class="brand-logo" src="../../logo.svg" width="28" height="28" alt="">
      <div class="brand-text">
        <div class="brand-name">Rep<span>Room</span></div>
        <div class="brand-sub">Windows packages</div>
      </div>
    </a>
    <div class="top-line" id="topLine"></div>
  </header>
  <nav class="stepbar" id="stepNav" aria-label="Steps"></nav>
  <main class="layout">
    <section class="stage" id="stage">
      <div class="stage-scroll" id="stageScroll">
        <div id="preview"></div>
        <div id="stepBody"></div>
      </div>
    </section>
    <aside class="side" id="side"></aside>
  </main>
  <div class="modal" id="custModal" hidden>
    <form class="form-card" id="custForm" autocomplete="off">
      <div class="form-title">Save this design</div>
      <div class="form-sub">Saved on this phone only. Add a customer name for the summary.</div>
      <label class="field"><span>Customer name</span><input id="custName" name="name" type="text" autocapitalize="words" required></label>
      <label class="field"><span>Address <em>(optional)</em></span><input id="custAddress" name="address" type="text" autocapitalize="words"></label>
      <div class="form-error" id="custError" hidden>Enter a customer name.</div>
      <div class="btns">
        <button type="button" class="btn ghost" id="custCancel">Cancel</button>
        <button type="submit" class="btn primary">Save summary</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="app.js?v=winpkg1"></script>
</body>
</html>
